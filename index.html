<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  :root {
    --spring: cubic-bezier(0.34, 1.4, 0.4, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    --bg-0: #eef0f4;
    --bg-1: #e6e9ef;
    --page-tint-a: #cfe3ff;
    --page-tint-b: #ffd9ec;
    --page-tint-c: #d6fff1;

    --glass-1: rgba(255,255,255,0.42);
    --glass-2: rgba(255,255,255,0.62);
    --glass-3: rgba(255,255,255,0.8);
    --glass-border: rgba(255,255,255,0.55);
    --glass-sheen: rgba(255,255,255,0.75);
    --glass-blur: 24px;

    --ink: #1c1c1e;
    --ink-dim: rgba(28,28,30,0.58);
    --ink-faint: rgba(28,28,30,0.38);
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,0.16);
    --danger: #ff453a;

    --shadow-1: 0 1px 3px rgba(20,25,40,0.08);
    --shadow-2: 0 10px 28px rgba(20,25,40,0.12);
    --shadow-3: 0 20px 50px rgba(20,25,40,0.18);

    --r-sm: 12px;
    --r-md: 18px;
    --r-lg: 28px;
    --r-pill: 999px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-0: #0e0f13;
      --bg-1: #16171c;
      --page-tint-a: #1c3a63;
      --page-tint-b: #4a2740;
      --page-tint-c: #1a4038;

      --glass-1: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.10);
      --glass-3: rgba(255,255,255,0.16);
      --glass-border: rgba(255,255,255,0.14);
      --glass-sheen: rgba(255,255,255,0.22);

      --ink: #f2f2f4;
      --ink-dim: rgba(242,242,244,0.6);
      --ink-faint: rgba(242,242,244,0.4);
      --accent: #409cff;
      --accent-soft: rgba(64,156,255,0.22);

      --shadow-1: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-2: 0 10px 28px rgba(0,0,0,0.4);
      --shadow-3: 0 20px 50px rgba(0,0,0,0.55);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 8%, var(--page-tint-a) 0%, transparent 50%),
      radial-gradient(circle at 88% 18%, var(--page-tint-b) 0%, transparent 46%),
      radial-gradient(circle at 30% 92%, var(--page-tint-c) 0%, transparent 50%),
      var(--bg-0);
    background-attachment: fixed;
    overflow-x: hidden;
    transition: background-color 0.3s var(--ease);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { letter-spacing: -0.02em; }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.28;
    pointer-events: none; z-index: 0; animation: drift 30s ease-in-out infinite alternate;
  }
  .blob1 { width: 420px; height: 420px; background: var(--page-tint-a); top: -120px; left: -100px; }
  .blob2 { width: 380px; height: 380px; background: var(--page-tint-b); bottom: -140px; right: -80px; animation-delay: -10s; }
  .blob3 { width: 300px; height: 300px; background: var(--page-tint-c); top: 42%; left: 62%; animation-delay: -18s; }
  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(24px,-16px) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .wrap {
    position: relative; z-index: 1; max-width: 1080px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 24px) max(24px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 80px) max(24px, env(safe-area-inset-left));
  }

  .navbar {
    position: sticky; top: 12px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 36px;
    padding: 14px 20px;
    border-radius: var(--r-pill);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 {
    font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand p { margin: 0; color: var(--ink-dim); font-size: 13px; }

  .owner-corner {
    position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 30; display: flex; gap: 8px;
  }
  .owner-corner button { font-size: 12.5px; padding: 8px 14px; min-height: 34px; }

  .glass {
    position: relative;
    background: var(--glass-1);
    border: 0.5px solid var(--glass-border);
    backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-sheen);
    isolation: isolate;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.08) 22%, rgba(255,255,255,0) 42%);
    mix-blend-mode: overlay;
    z-index: 1;
  }
  .glass > * { position: relative; z-index: 2; }
  .navbar.glass { background: var(--glass-2); box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-sheen); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    position: relative; overflow: hidden;
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
    background: var(--glass-2); border: 0.5px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 10px 16px; border-radius: var(--r-sm); cursor: pointer;
    transition: transform 0.28s var(--spring), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-sheen);
    min-height: 40px;
  }
  button::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 40%);
    mix-blend-mode: overlay;
  }
  button span { position: relative; z-index: 1; }
  button:hover { background: var(--glass-3); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--accent) 14%, transparent));
    border-color: color-mix(in srgb, var(--accent) 45%, var(--glass-border));
  }
  button.danger:hover { background: color-mix(in srgb, var(--danger) 22%, transparent); }
  button:disabled { opacity: 0.5; cursor: default; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px;
  }
  .tile {
    position: relative; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 1;
    border: 0.5px solid var(--glass-border);
    box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-sheen);
    cursor: pointer; background: var(--glass-1);
    transition: transform 0.3s var(--spring), box-shadow 0.3s var(--ease);
  }
  .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-sheen); }
  .tile:active { transform: scale(0.98); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s var(--ease); }
  .tile:hover img { transform: scale(1.04); }
  .tile .remove {
    position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: var(--r-sm);
    background: rgba(20,15,35,0.5); border: 0.5px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(12px); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; opacity: 0; transition: opacity 0.2s var(--ease), transform 0.2s var(--spring); padding: 0;
  }
  .tile:hover .remove { opacity: 1; }
  .tile .remove:active { transform: scale(0.9); }

  .upload-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--ink-dim); font-size: 13px; border-style: dashed;
  }
  .upload-tile svg { opacity: 0.8; }

  .empty { text-align: center; padding: 90px 20px; color: var(--ink-dim); border-radius: var(--r-lg); }
  .empty h2 { color: var(--ink); font-weight: 600; margin: 0 0 8px; font-size: 20px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,10,16,0.4); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    animation: fadeIn 0.22s var(--ease);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 400px; padding: 26px; border-radius: var(--r-lg);
    animation: modalIn 0.32s var(--spring);
    max-height: 85vh; overflow-y: auto;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .modal p { margin: 0 0 18px; color: var(--ink-dim); font-size: 14px; line-height: 1.5; }
  .modal input[type="password"], .modal input[type="text"] {
    width: 100%; padding: 12px 14px; border-radius: var(--r-sm); border: 0.5px solid var(--glass-border);
    background: var(--glass-1); color: var(--ink); font-size: 15px; font-family: inherit;
    outline: none; margin-bottom: 14px;
  }
  .modal input:focus { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent); }
  .modal .row { display: flex; gap: 10px; }
  .modal .row button { flex: 1; justify-content: center; }
  .error-text { color: var(--danger); font-size: 13px; margin: -8px 0 14px; }

  .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
  .color-row label { font-size: 14px; color: var(--ink-dim); }
  .color-row input[type="color"] {
    width: 44px; height: 32px; padding: 0; border-radius: 8px; border: 0.5px solid var(--glass-border);
    background: none; cursor: pointer;
  }

  .lightbox {
    position: fixed; inset: 0; background: rgba(6,6,10,0.75); backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center; z-index: 60;
    padding: max(24px, env(safe-area-inset-top)) 24px;
    animation: fadeIn 0.22s var(--ease);
  }
  .lightbox img { max-width: 100%; max-height: 85vh; border-radius: var(--r-md); box-shadow: var(--shadow-3); animation: modalIn 0.32s var(--spring); }
  .lightbox .close { position: absolute; top: 24px; right: 24px; width: 44px; height: 44px; border-radius: var(--r-sm); }

  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 24px); left: 50%; transform: translateX(-50%);
    padding: 11px 18px; font-size: 14px; z-index: 70; opacity: 0; transition: opacity 0.3s var(--ease);
    pointer-events: none; border-radius: var(--r-pill); max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  footer { margin-top: 44px; text-align: center; color: var(--ink-faint); font-size: 12.5px; }

  ::selection { background: var(--accent-soft); }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="wrap">
  <div class="navbar glass">
    <div class="brand">
      <h1 id="galleryTitle">Portfolio</h1>
      <p id="photoCount">Loading…</p>
    </div>
    <div class="actions">
      <button id="editBtn" style="display:none;"><span>Rename gallery</span></button>
      <button id="themeBtn" style="display:none;"><span>Customize</span></button>
      <button id="uploadBtn" class="primary" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V6M5 12l7-7 7 7"/></svg>
        <span>Upload</span>
      </button>
      <button id="lockBtn" style="display:none;"><span>Lock</span></button>
    </div>
  </div>

  <div id="gridArea"></div>

  <footer>Photos are stored in this site's GitHub repo and load for anyone with the link.</footer>
</div>

<div class="owner-corner">
  <button id="ownerBtn"><span>Owner sign in</span></button>
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

<div id="toast" class="toast glass"></div>

<script>
const GH_OWNER = 'Tommys2009';
const GH_REPO = 'photo-portfolio';
const GH_BRANCH = 'main';
const API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const RAW = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}`;
const TOKEN_KEY = 'gh_pat_' + GH_REPO;

let photos = [];
let galleryTitle = 'Portfolio';
let theme = {};
let isOwner = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function getToken() {
  try { return localStorage.getItem(TOKEN_KEY) || null; } catch(e) { return null; }
}
function setToken(tok) {
  try {
    if (tok) localStorage.setItem(TOKEN_KEY, tok);
    else localStorage.removeItem(TOKEN_KEY);
  } catch(e) {}
}

function authHeaders() {
  const tok = getToken();
  const h = { 'Accept': 'application/vnd.github+json' };
  if (tok) h['Authorization'] = 'token ' + tok;
  return h;
}

async function ghGetFile(path) {
  const res = await fetch(`${API}/contents/${path}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers: authHeaders() });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub read failed (' + res.status + ')');
  return res.json();
}

async function ghListDir(path) {
  const res = await fetch(`${API}/contents/${path}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers: authHeaders() });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error('GitHub list failed (' + res.status + ')');
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

async function ghPutFile(path, base64Content, message, sha) {
  const body = { message, content: base64Content, branch: GH_BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(`${API}/contents/${path}`, {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error('GitHub write failed (' + res.status + '): ' + errText.slice(0, 200));
  }
  return res.json();
}

async function ghDeleteFile(path, sha, message) {
  const res = await fetch(`${API}/contents/${path}`, {
    method: 'DELETE',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha, branch: GH_BRANCH })
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error('GitHub delete failed (' + res.status + '): ' + errText.slice(0, 200));
  }
}

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

async function loadMeta() {
  try {
    const file = await ghGetFile('meta.json');
    if (file && file.content) {
      const parsed = JSON.parse(base64ToUtf8(file.content.replace(/\n/g, '')));
      galleryTitle = parsed.title || 'Portfolio';
      theme = parsed.theme || {};
    }
  } catch(e) {
    console.warn('meta load failed', e);
  }
  document.getElementById('galleryTitle').textContent = galleryTitle;
  applyTheme();
}

async function saveMeta() {
  const existing = await ghGetFile('meta.json').catch(() => null);
  const content = utf8ToBase64(JSON.stringify({ title: galleryTitle, theme }, null, 2));
  await ghPutFile('meta.json', content, 'Update meta.json', existing ? existing.sha : undefined);
}

function applyTheme() {
  const root = document.documentElement.style;
  const map = {
    bg0: '--bg-0', bg1: '--bg-1',
    tintA: '--page-tint-a', tintB: '--page-tint-b', tintC: '--page-tint-c',
    accent: '--accent'
  };
  Object.entries(map).forEach(([key, cssVar]) => {
    if (theme[key]) root.setProperty(cssVar, theme[key]);
  });
}

async function loadPhotos() {
  try {
    const files = await ghListDir('photos');
    photos = files
      .filter(f => f.type === 'file')
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(f => ({ name: f.name, path: f.path, sha: f.sha, url: `${RAW}/${f.path}?t=${Date.now()}` }));
  } catch(e) {
    photos = [];
    console.warn('photo list failed', e);
  }
  renderGrid();
}

function renderGrid() {
  const area = document.getElementById('gridArea');
  const count = document.getElementById('photoCount');
  count.textContent = photos.length === 0 ? 'No photos yet' :
    (photos.length + (photos.length === 1 ? ' photo' : ' photos'));

  if (photos.length === 0 && !isOwner) {
    area.innerHTML = '<div class="glass empty"><h2>Nothing here yet</h2><p>The owner hasn\'t added any photos.</p></div>';
    return;
  }

  let html = '<div class="grid">';
  if (isOwner) {
    html += `<div class="tile upload-tile glass" id="uploadTile">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 19V6M5 12l7-7 7 7"/></svg>
      <span>Add photos</span>
    </div>`;
  }
  photos.slice().reverse().forEach((p) => {
    html += `<div class="tile" data-path="${p.path}">
      <img src="${p.url}" loading="lazy">
      ${isOwner ? `<button class="remove" data-remove="${p.path}" aria-label="Remove photo">✕</button>` : ''}
    </div>`;
  });
  html += '</div>';
  area.innerHTML = html;

  if (isOwner) {
    document.getElementById('uploadTile').addEventListener('click', () => document.getElementById('fileInput').click());
    area.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removePhoto(btn.getAttribute('data-remove'));
      });
    });
  }
  area.querySelectorAll('.tile[data-path]').forEach(tile => {
    tile.addEventListener('click', () => {
      const path = tile.getAttribute('data-path');
      const p = photos.find(x => x.path === path);
      if (p) openLightbox(p.url);
    });
  });
}

function openLightbox(src) {
  const overlay = document.createElement('div');
  overlay.className = 'lightbox';
  overlay.innerHTML = `<img src="${src}"><button class="close glass" aria-label="Close">✕</button>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('.close').addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

async function removePhoto(path) {
  const p = photos.find(x => x.path === path);
  if (!p) return;
  try {
    await ghDeleteFile(p.path, p.sha, 'Remove photo ' + p.name);
    photos = photos.filter(x => x.path !== path);
    renderGrid();
    toast('Photo removed');
  } catch(e) {
    toast('Couldn\'t remove: ' + e.message);
  }
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function maybeDownscale(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1800;
      let { width, height } = img;
      if (width <= maxDim && height <= maxDim) { resolve(dataUrl); return; }
      const scale = maxDim / Math.max(width, height);
      const canvas = document.createElement('canvas');
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.88));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (files.length === 0) return;
  toast('Uploading…');
  let uploaded = 0;
  for (const file of files) {
    try {
      let dataUrl = await fileToDataUrl(file);
      dataUrl = await maybeDownscale(dataUrl);
      const base64 = dataUrl.split(',')[1];
      const filename = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      await ghPutFile('photos/' + filename, base64, 'Add photo ' + filename);
      uploaded++;
    } catch(e) {
      toast('Upload failed: ' + e.message);
    }
  }
  if (uploaded > 0) {
    await loadPhotos();
    toast(uploaded === 1 ? 'Photo uploaded' : uploaded + ' photos uploaded');
  }
}

function showModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal glass">${html}</div>`;
  document.body.appendChild(overlay);
  return overlay;
}

async function verifyToken(token) {
  const res = await fetch(API, { headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' } });
  if (!res.ok) return { ok: false, reason: 'Token was rejected by GitHub.' };
  const data = await res.json();
  if (data.permissions && data.permissions.push) return { ok: true };
  return { ok: false, reason: 'This token doesn\'t have write access to this repo.' };
}

function handleOwnerClick() {
  const overlay = showModal(`
    <h3>Owner sign in</h3>
    <p>Paste a GitHub personal access token with write access to the <b>${GH_OWNER}/${GH_REPO}</b> repo. It's stored only on this device and is what lets you upload, delete, and customize.</p>
    <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off">
    <div class="error-text" id="tokenError" style="display:none;"></div>
    <div class="row">
      <button id="cancelSignin"><span>Cancel</span></button>
      <button id="submitToken" class="primary"><span>Sign in</span></button>
    </div>
  `);
  const input = overlay.querySelector('#tokenInput');
  const err = overlay.querySelector('#tokenError');
  const submitBtn = overlay.querySelector('#submitToken');
  overlay.querySelector('#cancelSignin').addEventListener('click', () => overlay.remove());
  const submit = async () => {
    const val = input.value.trim();
    if (!val) { err.textContent = 'Paste a token first.'; err.style.display = 'block'; return; }
    submitBtn.disabled = true;
    submitBtn.querySelector('span').textContent = 'Checking...';
    try {
      const result = await verifyToken(val);
      if (!result.ok) {
        err.textContent = result.reason;
        err.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Sign in';
        return;
      }
      setToken(val);
      overlay.remove();
      setOwnerMode(true);
      toast('Signed in');
    } catch(e) {
      err.textContent = 'Could not reach GitHub: ' + e.message;
      err.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.querySelector('span').textContent = 'Sign in';
    }
  };
  submitBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  input.focus();
}

function setOwnerMode(on) {
  isOwner = on;
  document.getElementById('ownerBtn').style.display = on ? 'none' : 'inline-flex';
  document.getElementById('uploadBtn').style.display = on ? 'inline-flex' : 'none';
  document.getElementById('lockBtn').style.display = on ? 'inline-flex' : 'none';
  document.getElementById('editBtn').style.display = on ? 'inline-flex' : 'none';
  document.getElementById('themeBtn').style.display = on ? 'inline-flex' : 'none';
  renderGrid();
}

async function handleRename() {
  const overlay = showModal(`
    <h3>Rename gallery</h3>
    <input type="text" id="titleInput" value="${galleryTitle.replace(/"/g, '&quot;')}" placeholder="Gallery name">
    <div class="error-text" id="renameError" style="display:none;"></div>
    <div class="row">
      <button id="cancelTitle"><span>Cancel</span></button>
      <button id="saveTitle" class="primary"><span>Save</span></button>
    </div>
  `);
  overlay.querySelector('#cancelTitle').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#saveTitle').addEventListener('click', async () => {
    const val = overlay.querySelector('#titleInput').value.trim() || 'Portfolio';
    const prev = galleryTitle;
    galleryTitle = val;
    document.getElementById('galleryTitle').textContent = val;
    try {
      await saveMeta();
      overlay.remove();
      toast('Saved');
    } catch(e) {
      galleryTitle = prev;
      document.getElementById('galleryTitle').textContent = prev;
      overlay.querySelector('#renameError').textContent = 'Save failed: ' + e.message;
      overlay.querySelector('#renameError').style.display = 'block';
    }
  });
  overlay.querySelector('#titleInput').focus();
}

function currentThemeValue(key, fallback) {
  return theme[key] || getComputedStyle(document.documentElement).getPropertyValue(fallback).trim() || '#000000';
}

async function handleTheme() {
  const fields = [
    { key: 'bg0', label: 'Page background', cssVar: '--bg-0' },
    { key: 'bg1', label: 'Page background (alt)', cssVar: '--bg-1' },
    { key: 'tintA', label: 'Glow tint 1', cssVar: '--page-tint-a' },
    { key: 'tintB', label: 'Glow tint 2', cssVar: '--page-tint-b' },
    { key: 'tintC', label: 'Glow tint 3', cssVar: '--page-tint-c' },
    { key: 'accent', label: 'Accent color', cssVar: '--accent' }
  ];
  const rowsHtml = fields.map(f => `
    <div class="color-row">
      <label for="c_${f.key}">${f.label}</label>
      <input type="color" id="c_${f.key}" value="${toHex(currentThemeValue(f.key, f.cssVar))}">
    </div>
  `).join('');
  const overlay = showModal(`
    <h3>Customize appearance</h3>
    <p>Changes preview live and save to this site's repo once you hit save.</p>
    ${rowsHtml}
    <div class="error-text" id="themeError" style="display:none;"></div>
    <div class="row">
      <button id="cancelTheme"><span>Cancel</span></button>
      <button id="saveTheme" class="primary"><span>Save</span></button>
    </div>
  `);
  fields.forEach(f => {
    overlay.querySelector('#c_' + f.key).addEventListener('input', (e) => {
      document.documentElement.style.setProperty(f.cssVar, e.target.value);
    });
  });
  overlay.querySelector('#cancelTheme').addEventListener('click', () => {
    applyTheme();
    overlay.remove();
  });
  overlay.querySelector('#saveTheme').addEventListener('click', async () => {
    fields.forEach(f => { theme[f.key] = overlay.querySelector('#c_' + f.key).value; });
    try {
      await saveMeta();
      overlay.remove();
      toast('Appearance saved');
    } catch(e) {
      overlay.querySelector('#themeError').textContent = 'Save failed: ' + e.message;
      overlay.querySelector('#themeError').style.display = 'block';
    }
  });
}

function toHex(color) {
  if (color.startsWith('#')) return color;
  const m = color.match(/rgba?\(([^)]+)\)/);
  if (!m) return '#000000';
  const parts = m[1].split(',').map(s => parseInt(s.trim(), 10));
  return '#' + parts.slice(0, 3).map(n => n.toString(16).padStart(2, '0')).join('');
}

document.getElementById('ownerBtn').addEventListener('click', handleOwnerClick);
document.getElementById('lockBtn').addEventListener('click', () => { setOwnerMode(false); toast('Locked'); });
document.getElementById('editBtn').addEventListener('click', handleRename);
document.getElementById('themeBtn').addEventListener('click', handleTheme);
document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

document.addEventListener('dragover', (e) => { if (isOwner) e.preventDefault(); });
document.addEventListener('drop', (e) => {
  if (!isOwner) return;
  e.preventDefault();
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

(async function init() {
  await loadMeta();
  await loadPhotos();
  const tok = getToken();
  if (tok) {
    try {
      const result = await verifyToken(tok);
      if (result.ok) setOwnerMode(true);
      else setToken(null);
    } catch(e) {}
  }
})();
</script>
